
services:
  postgres:
    image: postgres:17
    container_name: car-rental-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: car_rental_db
      POSTGRES_USER: carrental
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U carrental -d car_rental_db
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
